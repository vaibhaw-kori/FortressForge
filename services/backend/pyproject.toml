[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA-Install backend (FastAPI modular monolith)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "AURA Team" }]

dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",
  "anyio>=4.4,<5.0",
  "redis>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.20",
  "pyjwt>=2.9,<3.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]
gpu = [
  "torch>=2.2",
  "opencv-python>=4.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aura_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]